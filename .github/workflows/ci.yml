name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeatherCad
    steps:
      # The Atelier engine is consumed as `link:../atelier/packages/*` source
      # symlinks, so it must be checked out as a sibling directory — the same
      # layout seamer-studio's CI uses.
      - name: Checkout LeatherCad
        uses: actions/checkout@v4
        with:
          path: LeatherCad

      - name: Checkout atelier
        uses: actions/checkout@v4
        with:
          repository: ahzs645/atelier
          path: atelier

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LeatherCad/pnpm-lock.yaml

      - name: Install engine dependencies
        run: pnpm install --frozen-lockfile
        working-directory: atelier

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture guardrails
        run: pnpm check:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # `pnpm test:e2e` is not run here. It is a local gate -- see e2e/README.md.
      #
      # The suite drives a real browser against two servers it starts itself:
      # the dev server, and a production `vite build` it then previews. On a
      # shared runner that is a two-minute step whose slowest parts are a WebGL
      # canvas mounting under software rendering, and it is the step most likely
      # to fail for reasons that are about the runner rather than the change.
      # The unit suite above covers the same logic headlessly; what e2e adds is
      # that it reaches the screen, which is worth asserting before a release
      # rather than on every push.
      - name: Build
        run: pnpm build

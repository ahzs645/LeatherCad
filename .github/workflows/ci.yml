name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeatherCad
    steps:
      # The Atelier engine is consumed as `link:../atelier/packages/*` source
      # symlinks, so it must be checked out as a sibling directory — the same
      # layout seamer-studio's CI uses.
      - name: Checkout LeatherCad
        uses: actions/checkout@v4
        with:
          path: LeatherCad

      - name: Checkout atelier
        uses: actions/checkout@v4
        with:
          repository: ahzs645/atelier
          path: atelier

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LeatherCad/pnpm-lock.yaml

      - name: Install engine dependencies
        run: pnpm install --frozen-lockfile
        working-directory: atelier

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Lint
        run: pnpm lint

      - name: Architecture guardrails
        run: pnpm check:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: UI smoke test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

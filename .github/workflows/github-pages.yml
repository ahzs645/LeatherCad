name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeatherCad
    steps:
      # Sibling checkout: the app consumes the Atelier engine through
      # `link:../atelier/packages/*` dependencies.
      - name: Checkout LeatherCad
        uses: actions/checkout@v4
        with:
          path: LeatherCad

      - name: Checkout atelier
        uses: actions/checkout@v4
        with:
          repository: ahzs645/atelier
          path: atelier

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LeatherCad/pnpm-lock.yaml

      - name: Install engine dependencies
        run: pnpm install --frozen-lockfile
        working-directory: atelier

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build app
        run: pnpm build
        env:
          VITE_BASE_PATH: /LeatherCad/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./LeatherCad/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

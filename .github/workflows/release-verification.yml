name: Verify release pair
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeatherCad
    steps:
      - uses: actions/checkout@v4
        with:
          path: LeatherCad
      - uses: actions/checkout@v4
        with:
          repository: ahzs645/atelier
          path: atelier
          ref: 186feaf7b63e0928c5a27a78f874497e1a8cdfdd
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LeatherCad/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: atelier
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:engine && pnpm lint && pnpm check:architecture && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:cloud-readiness
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:release
      - run: pnpm test:webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            LeatherCad/dist
            LeatherCad/test-results

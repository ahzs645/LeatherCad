  <style>
    @page {

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #f3f4f6;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 10px;
      background: #111827;
      color: #f9fafb;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .toolbar button {
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      background: #f59e0b;
      color: #111827;
      font-weight: 600;
    }
    .print-page {
      width: 297mm;
      height: 210mm;
      margin: 10px auto;
      background: #fff;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.14);
      page-break-after: always;
    }
    .print-page:last-of-type {
      page-break-after: auto;
    }
    .print-svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    @media print {
      body {
        background: transparent;
      }
      .toolbar {
        display: none;
      }
      .print-page {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

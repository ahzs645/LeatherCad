<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LeatherCAD Print Tiles</title>
  <style>
    @page {
      size: 210mm 297mm;
      margin: 0;
    }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #f3f4f6;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 10px;
      background: #111827;
      color: #f9fafb;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .toolbar button {
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      background: #f59e0b;
      color: #111827;
      font-weight: 600;
    }
    .print-page {
      width: 210mm;
      height: 297mm;
      margin: 10px auto;
      background: #fff;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.14);
      page-break-after: always;
    }
    .print-page:last-of-type {
      page-break-after: auto;
    }
    .print-svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    @media print {
      body {
        background: transparent;
      }
      .toolbar {
        display: none;
      }
      .print-page {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">Print</button>
    <span>1 page(s) | calibration 110.00% x 90.00% | active DPI 105.6 x 86.4</span>
  </div>
  <section class="print-page"><svg class="print-svg" xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <svg x="10" y="10" width="190" height="277" viewBox="0 0 172.72727272727272 307.77777777777777" preserveAspectRatio="none" overflow="hidden">
  <rect x="0" y="0" width="172.727" height="307.778" fill="#ffffff" />
  <g>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="0" y1="0" x2="0" y2="100" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="100" y1="0" x2="100" y2="100" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="0" y1="100" x2="100" y2="100" stroke="#111827" stroke-width="0.25" fill="none" />
<text x="10" y="20" fill="#111827" font-size="4" font-family="sans-serif" transform="rotate(0 10 20)">100 mm X / 100 mm Y</text>
<text x="10" y="40" fill="#111827" font-size="4" font-family="sans-serif" transform="rotate(0 10 40)">Pitch: 4 mm (40 mm over 10 intervals)</text>
<line x1="10" y1="50" x2="10" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="14" y1="50" x2="14" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="18" y1="50" x2="18" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="22" y1="50" x2="22" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="26" y1="50" x2="26" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="30" y1="50" x2="30" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="34" y1="50" x2="34" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="38" y1="50" x2="38" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="42" y1="50" x2="42" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="46" y1="50" x2="46" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="50" y1="50" x2="50" y2="55" stroke="#111827" stroke-width="0.25" fill="none" />
<line x1="70" y1="70" x2="90" y2="90" stroke="#111827" stroke-width="0.25" fill="none" />
<text x="10" y="80" fill="#111827" font-size="4" font-family="sans-serif" transform="rotate(0 10 80)">Keep this corner at bottom right</text>


  </g>

  <rect x="0" y="0" width="172.727" height="307.778" fill="none" stroke="#374151" stroke-width="0.35" />
  <text x="4" y="6" font-size="4" fill="#111827">Page 1-1</text>
</svg></svg></section>
</body>
</html>
